services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: devmeet
      POSTGRES_USER: devmeet
      POSTGRES_PASSWORD: devmeet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init_dev_schema.sql:/docker-entrypoint-initdb.d/01_init_dev_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmeet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Backend Microservices ──────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    volumes:
      - ./services/auth-service/app:/app/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-devmeet_jwt_secret_change_in_prod}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    ports:
      - "8002:8002"
    volumes:
      - ./services/user-service/app:/app/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth-service:8001
      - FILE_SERVICE_URL=http://file-service:8011
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orchestrator-service:
    build: ./services/orchestrator-service
    ports:
      - "8003:8003"
    volumes:
      - ./services/orchestrator-service/app:/app/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - AI_INTERVIEWER_URL=http://ai-interviewer-service:8004
      - SEARCH_SERVICE_URL=http://search-service:8013
      - FEEDBACK_SERVICE_URL=http://feedback-service:8007
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-interviewer-service:
    build: ./services/ai-interviewer-service
    ports:
      - "8004:8004"
    volumes:
      - ./services/ai-interviewer-service/app:/app/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  code-execution-service:
    build: ./services/code-execution-service
    ports:
      - "8005:8005"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  video-service:
    build: ./services/video-service
    ports:
      - "8006:8006"
    volumes:
      - ./services/video-service/recordings:/app/recordings
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

  feedback-service:
    build: ./services/feedback-service
    ports:
      - "8007:8007"
    volumes:
      - ./services/feedback-service/app:/app/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - FILE_SERVICE_URL=http://file-service:8011
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_S3_REPORTS_BUCKET=${AWS_S3_REPORTS_BUCKET:-devmeet-s3-bucket}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      - postgres
      - redis
      - rabbitmq

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "8009:8009"
    volumes:
      - ./services/analytics-service/app:/app/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  admin-service:
    build: ./services/admin-service
    ports:
      - "8010:8010"
    volumes:
      - ./services/admin-service/app:/app/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth-service:8001
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    depends_on:
      - postgres
      - redis
      - auth-service

  file-service:
    build: ./services/file-service
    ports:
      - "8011:8011"
    volumes:
      - ./services/file-service/app:/app/app
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - BASE_URL=http://localhost:8011

  payment-service:
    build: ./services/payment-service
    ports:
      - "8012:8012"
    volumes:
      - ./services/payment-service/app:/app/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devmeet
      - POSTGRES_USER=devmeet
      - POSTGRES_PASSWORD=devmeet_password
      - USER_SERVICE_URL=http://user-service:8002
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      - postgres

  search-service:
    build: ./services/search-service
    ports:
      - "8013:8013"
    volumes:
      - ./services/search-service/app:/app/app

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_NOTIF_WS_URL=ws://localhost:8008
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_GATEWAY_URL=http://api-gateway:8000
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
      - NEXT_PUBLIC_AUTH_URL=http://auth-service:8001
      - NEXT_PUBLIC_USER_URL=http://user-service:8002
      - NEXT_PUBLIC_ORCH_URL=http://orchestrator-service:8003
      - NEXT_PUBLIC_AI_URL=http://ai-interviewer-service:8004
      - NEXT_PUBLIC_EXEC_URL=http://code-execution-service:8005
      - NEXT_PUBLIC_VIDEO_URL=http://video-service:8006
      - NEXT_PUBLIC_FEEDBACK_URL=http://feedback-service:8007
      - NEXT_PUBLIC_NOTIF_URL=http://notification-service:8008
      - NEXT_PUBLIC_ANALYTICS_URL=http://analytics-service:8009
      - NEXT_PUBLIC_ADMIN_URL=http://admin-service:8010
      - NEXT_PUBLIC_FILE_URL=http://file-service:8011
      - NEXT_PUBLIC_PAYMENT_URL=http://payment-service:8012
      - NEXT_PUBLIC_SEARCH_URL=http://search-service:8013
    restart: unless-stopped

  # ── Nginx API Gateway ──────────────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - user-service
      - orchestrator-service
      - ai-interviewer-service
      - code-execution-service
      - video-service
      - feedback-service
      - analytics-service
      - admin-service
      - file-service
      - payment-service
      - search-service

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
