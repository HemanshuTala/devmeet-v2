global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'devmeet-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'auth-service:8001'
          - 'user-service:8002'
          - 'orchestrator-service:8003'
          - 'ai-interviewer-service:8004'
          - 'code-execution-service:8005'
          - 'video-service:8006'
          - 'feedback-service:8007'
          - 'notification-service:8008'
          - 'analytics-service:8009'
          - 'admin-service:8010'
          - 'file-service:8011'
          - 'payment-service:8012'
          - 'search-service:8013'
          - 'api-gateway:8000'
