apiVersion: v1
kind: ConfigMap
metadata:
  name: devmeet-config
  namespace: devmeet
data:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "devmeet"

  # ── Redis ─────────────────────────────────────────────────────────────────
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # ── Elasticsearch ─────────────────────────────────────────────────────────
  ELASTICSEARCH_HOST: "http://elasticsearch-service:9200"

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"

  # ── Kafka ─────────────────────────────────────────────────────────────────
  KAFKA_BROKERS: "kafka-service:9092"

  # ── Internal service URLs ─────────────────────────────────────────────────
  AUTH_SERVICE_URL: "http://auth-service:8001"
  USER_SERVICE_URL: "http://user-service:8002"
  ORCHESTRATOR_SERVICE_URL: "http://orchestrator-service:8003"
  AI_INTERVIEWER_URL: "http://ai-interviewer-service:8004"
  FILE_SERVICE_URL: "http://file-service:8011"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8008"
  FEEDBACK_SERVICE_URL: "http://feedback-service:8007"
  PAYMENT_SERVICE_URL: "http://payment-service:8012"
  SEARCH_SERVICE_URL: "http://search-service:8013"

  # ── Service ports ─────────────────────────────────────────────────────────
  AUTH_SERVICE_PORT: "8001"
  USER_SERVICE_PORT: "8002"
  ORCHESTRATOR_SERVICE_PORT: "8003"
  AI_INTERVIEWER_SERVICE_PORT: "8004"
  CODE_EXECUTION_SERVICE_PORT: "8005"
  VIDEO_SERVICE_PORT: "8006"
  FEEDBACK_SERVICE_PORT: "8007"
  NOTIFICATION_SERVICE_PORT: "8008"
  ANALYTICS_SERVICE_PORT: "8009"
  ADMIN_SERVICE_PORT: "8010"
  FILE_SERVICE_PORT: "8011"
  PAYMENT_SERVICE_PORT: "8012"
  SEARCH_SERVICE_PORT: "8013"

  # ── JWT (non-secret settings) ─────────────────────────────────────────────
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # ── OAuth redirect ────────────────────────────────────────────────────────
  OAUTH_REDIRECT_URI: "https://api.devmeet.com/api/v1/auth/oauth/callback"
  FRONTEND_URL: "https://devmeet.com"
