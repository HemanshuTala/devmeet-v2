apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-interviewer-service
  namespace: devmeet
spec:
  replicas: 5
  selector:
    matchLabels:
      app: ai-interviewer-service
  template:
    metadata:
      labels:
        app: ai-interviewer-service
    spec:
      containers:
      - name: ai-interviewer-service
        image: devmeet/ai-interviewer-service:latest
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: devmeet-config
        - secretRef:
            name: devmeet-secrets
        env:
        - name: AI_INTERVIEWER_SERVICE_PORT
          value: "8004"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-interviewer-service
  namespace: devmeet
spec:
  selector:
    app: ai-interviewer-service
  ports:
  - port: 8004
    targetPort: 8004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-interviewer-service-hpa
  namespace: devmeet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-interviewer-service
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
