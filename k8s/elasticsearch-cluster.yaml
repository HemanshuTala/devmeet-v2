---
# Elasticsearch StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: devmeet
spec:
  serviceName: elasticsearch
  replicas: 3
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers:
      - name: increase-vm-max-map
        image: busybox:1.32.0
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
      - name: increase-fd-ulimit
        image: busybox:1.32.0
        command: ["sh", "-c", "ulimit -n 65536"]
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        env:
        - name: cluster.name
          value: "devmeet-es"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: "elasticsearch-0.elasticsearch,elasticsearch-1.elasticsearch,elasticsearch-2.elasticsearch"
        - name: cluster.initial_master_nodes
          value: "elasticsearch-0,elasticsearch-1,elasticsearch-2"
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: xpack.security.enabled
          value: "true"
        - name: xpack.security.transport.ssl.enabled
          value: "true"
        - name: xpack.security.transport.ssl.verification_mode
          value: "certificate"
        - name: xpack.security.transport.ssl.keystore.path
          value: "/usr/share/elasticsearch/config/elastic-certificates.p12"
        - name: xpack.security.transport.ssl.truststore.path
          value: "/usr/share/elasticsearch/config/elastic-certificates.p12"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-credentials
              key: password
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
        - name: elastic-certificates
          mountPath: /usr/share/elasticsearch/config/elastic-certificates.p12
          subPath: elastic-certificates.p12
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=5s
            port: 9200
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: elastic-certificates
        secret:
          secretName: elastic-certificates
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi

---
# Elasticsearch Service
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: devmeet
spec:
  clusterIP: None
  ports:
  - port: 9200
    name: http
  - port: 9300
    name: transport
  selector:
    app: elasticsearch

---
# Elasticsearch Client Service
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-client
  namespace: devmeet
spec:
  type: ClusterIP
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  selector:
    app: elasticsearch

---
# Elasticsearch Credentials
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-credentials
  namespace: devmeet
type: Opaque
stringData:
  username: elastic
  password: changeme-in-production
  url: http://elasticsearch-client:9200

---
# Kibana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: devmeet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.11.0
        ports:
        - containerPort: 5601
          name: http
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-client:9200"
        - name: ELASTICSEARCH_USERNAME
          value: "elastic"
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-credentials
              key: password
        - name: SERVER_NAME
          value: "kibana.devmeet.com"
        - name: SERVER_BASEPATH
          value: "/kibana"
        - name: SERVER_REWRITEBASEPATH
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
# Kibana Service
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: devmeet
spec:
  type: ClusterIP
  ports:
  - port: 5601
    targetPort: 5601
    name: http
  selector:
    app: kibana

---
# Elasticsearch Index Initializer Job
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  namespace: devmeet
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: es-init
        image: curlimages/curl:latest
        env:
        - name: ES_URL
          value: "http://elasticsearch-client:9200"
        - name: ES_USER
          value: "elastic"
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-credentials
              key: password
        command:
        - /bin/sh
        - -c
        - |
          # Wait for Elasticsearch to be ready
          until curl -u $ES_USER:$ES_PASSWORD -s $ES_URL/_cluster/health | grep -q '"status":"green\|yellow"'; do
            echo "Waiting for Elasticsearch..."
            sleep 5
          done
          
          echo "Creating interview questions index..."
          curl -X PUT -u $ES_USER:$ES_PASSWORD "$ES_URL/interview_questions" -H 'Content-Type: application/json' -d'
          {
            "settings": {
              "number_of_shards": 3,
              "number_of_replicas": 2,
              "analysis": {
                "analyzer": {
                  "code_analyzer": {
                    "type": "custom",
                    "tokenizer": "standard",
                    "filter": ["lowercase", "stop", "snowball"]
                  }
                }
              }
            },
            "mappings": {
              "properties": {
                "title": {
                  "type": "text",
                  "analyzer": "standard"
                },
                "description": {
                  "type": "text",
                  "analyzer": "standard"
                },
                "difficulty": {
                  "type": "keyword"
                },
                "category": {
                  "type": "keyword"
                },
                "tags": {
                  "type": "keyword"
                },
                "language": {
                  "type": "keyword"
                },
                "mode": {
                  "type": "keyword"
                },
                "company": {
                  "type": "keyword"
                },
                "code_template": {
                  "type": "text",
                  "analyzer": "code_analyzer"
                },
                "test_cases": {
                  "type": "object",
                  "enabled": false
                },
                "created_at": {
                  "type": "date"
                },
                "updated_at": {
                  "type": "date"
                }
              }
            }
          }'
          
          echo "Creating user analytics index..."
          curl -X PUT -u $ES_USER:$ES_PASSWORD "$ES_URL/user_analytics" -H 'Content-Type: application/json' -d'
          {
            "settings": {
              "number_of_shards": 3,
              "number_of_replicas": 2
            },
            "mappings": {
              "properties": {
                "user_id": {"type": "keyword"},
                "event_type": {"type": "keyword"},
                "session_id": {"type": "keyword"},
                "timestamp": {"type": "date"},
                "metadata": {"type": "object", "enabled": false}
              }
            }
          }'
          
          echo "Creating audit logs index..."
          curl -X PUT -u $ES_USER:$ES_PASSWORD "$ES_URL/audit_logs" -H 'Content-Type: application/json' -d'
          {
            "settings": {
              "number_of_shards": 2,
              "number_of_replicas": 2
            },
            "mappings": {
              "properties": {
                "user_id": {"type": "keyword"},
                "action": {"type": "keyword"},
                "resource": {"type": "keyword"},
                "ip_address": {"type": "ip"},
                "timestamp": {"type": "date"},
                "details": {"type": "object", "enabled": false}
              }
            }
          }'
          
          echo "Elasticsearch indices created successfully"
