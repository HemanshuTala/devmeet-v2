apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: devmeet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
      - name: search-service
        image: devmeet/search-service:latest
        ports:
        - containerPort: 8012
        envFrom:
        - configMapRef:
            name: devmeet-config
        - secretRef:
            name: devmeet-secrets
        env:
        - name: SEARCH_SERVICE_PORT
          value: "8012"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: devmeet
spec:
  selector:
    app: search-service
  ports:
  - port: 8012
    targetPort: 8012
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service-hpa
  namespace: devmeet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
