---
# RabbitMQ StatefulSet with durable queues
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: devmeet
spec:
  serviceName: rabbitmq
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      serviceAccountName: rabbitmq
      initContainers:
      - name: rabbitmq-config
        image: busybox:1.32.0
        volumeMounts:
        - name: rabbitmq-config
          mountPath: /tmp/rabbitmq
        - name: rabbitmq-config-rw
          mountPath: /etc/rabbitmq
        command:
        - sh
        - -c
        - cp /tmp/rabbitmq/rabbitmq.conf /etc/rabbitmq/rabbitmq.conf && echo '' >> /etc/rabbitmq/rabbitmq.conf;
          cp /tmp/rabbitmq/enabled_plugins /etc/rabbitmq/enabled_plugins
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        - containerPort: 4369
          name: epmd
        - containerPort: 25672
          name: dist
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        - name: RABBITMQ_ERLANG_COOKIE
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: erlang-cookie
        - name: RABBITMQ_USE_LONGNAME
          value: "true"
        - name: RABBITMQ_NODENAME
          value: rabbit@$(POD_NAME).rabbitmq.devmeet.svc.cluster.local
        - name: K8S_SERVICE_NAME
          value: rabbitmq
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_HOSTNAME_SUFFIX
          value: .rabbitmq.$(POD_NAMESPACE).svc.cluster.local
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        - name: rabbitmq-config-rw
          mountPath: /etc/rabbitmq
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 15
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_port_connectivity
          initialDelaySeconds: 20
          periodSeconds: 60
          timeoutSeconds: 10
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: rabbitmq-config
        configMap:
          name: rabbitmq-config
      - name: rabbitmq-config-rw
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi

---
# RabbitMQ Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: devmeet

---
# RabbitMQ Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: devmeet
rules:
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get"]

---
# RabbitMQ RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: devmeet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery
subjects:
- kind: ServiceAccount
  name: rabbitmq

---
# RabbitMQ Headless Service
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: devmeet
spec:
  clusterIP: None
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  - port: 4369
    targetPort: 4369
    name: epmd
  - port: 25672
    targetPort: 25672
    name: dist
  selector:
    app: rabbitmq

---
# RabbitMQ Client Service
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-client
  namespace: devmeet
spec:
  type: ClusterIP
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  selector:
    app: rabbitmq

---
# RabbitMQ Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: devmeet
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_peer_discovery_k8s,rabbitmq_prometheus].
  rabbitmq.conf: |
    # Clustering
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.service_name = rabbitmq
    cluster_formation.node_cleanup.interval = 30
    cluster_formation.node_cleanup.only_log_warning = true
    cluster_partition_handling = autoheal
    
    # Queue master locator
    queue_master_locator = min-masters
    
    # Durable queues
    default_queue_type = classic
    
    # Memory and disk
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 2GB
    
    # Logging
    log.console.level = info
    log.file.level = info
    
    # Metrics
    management.load_definitions = /etc/rabbitmq/definitions.json
    prometheus.return_per_object_metrics = true

  definitions.json: |
    {
      "queues": [
        {
          "name": "code_execution",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-message-ttl": 3600000,
            "x-max-length": 10000,
            "x-overflow": "reject-publish",
            "x-dead-letter-exchange": "dlx",
            "x-dead-letter-routing-key": "code_execution.dlq"
          }
        },
        {
          "name": "code_execution.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false
        },
        {
          "name": "feedback_generation",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-message-ttl": 7200000,
            "x-max-length": 5000,
            "x-dead-letter-exchange": "dlx",
            "x-dead-letter-routing-key": "feedback_generation.dlq"
          }
        },
        {
          "name": "feedback_generation.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false
        },
        {
          "name": "notifications",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-message-ttl": 86400000,
            "x-max-length": 20000,
            "x-dead-letter-exchange": "dlx",
            "x-dead-letter-routing-key": "notifications.dlq"
          }
        },
        {
          "name": "notifications.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false
        },
        {
          "name": "email_notifications",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-message-ttl": 86400000,
            "x-dead-letter-exchange": "dlx",
            "x-dead-letter-routing-key": "email_notifications.dlq"
          }
        },
        {
          "name": "email_notifications.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false
        }
      ],
      "exchanges": [
        {
          "name": "dlx",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false
        },
        {
          "name": "interviews",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false
        },
        {
          "name": "notifications",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false
        }
      ],
      "bindings": [
        {
          "source": "dlx",
          "vhost": "/",
          "destination": "code_execution.dlq",
          "destination_type": "queue",
          "routing_key": "code_execution.dlq"
        },
        {
          "source": "dlx",
          "vhost": "/",
          "destination": "feedback_generation.dlq",
          "destination_type": "queue",
          "routing_key": "feedback_generation.dlq"
        },
        {
          "source": "dlx",
          "vhost": "/",
          "destination": "notifications.dlq",
          "destination_type": "queue",
          "routing_key": "notifications.dlq"
        },
        {
          "source": "dlx",
          "vhost": "/",
          "destination": "email_notifications.dlq",
          "destination_type": "queue",
          "routing_key": "email_notifications.dlq"
        }
      ],
      "policies": [
        {
          "name": "ha-all",
          "pattern": ".*",
          "vhost": "/",
          "definition": {
            "ha-mode": "exactly",
            "ha-params": 2,
            "ha-sync-mode": "automatic"
          }
        }
      ]
    }

---
# RabbitMQ Secret
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: devmeet
type: Opaque
stringData:
  username: admin
  password: changeme-in-production
  erlang-cookie: supersecreterlangcookie123456
