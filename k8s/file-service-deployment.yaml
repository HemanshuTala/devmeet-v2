apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: devmeet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
      - name: file-service
        image: devmeet/file-service:latest
        ports:
        - containerPort: 8011
        envFrom:
        - configMapRef:
            name: devmeet-config
        - secretRef:
            name: devmeet-secrets
        env:
        - name: FILE_SERVICE_PORT
          value: "8011"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: devmeet
spec:
  selector:
    app: file-service
  ports:
  - port: 8011
    targetPort: 8011
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-service-hpa
  namespace: devmeet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
