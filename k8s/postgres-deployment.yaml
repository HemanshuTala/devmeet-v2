apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devmeet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        command:
          - postgres
          - -c
          - max_connections=200
          - -c
          - shared_buffers=256MB
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "devmeet"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: devmeet-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devmeet-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - devmeet
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - devmeet
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: devmeet
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# PVC with AWS EBS gp3 storage class (EKS provisioned automatically via EBS CSI driver).
# For docker-compose or local k8s (minikube), change storageClassName to "standard".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devmeet
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3   # AWS EBS gp3 — fastest + cheapest EBS class
  resources:
    requests:
      storage: 20Gi
