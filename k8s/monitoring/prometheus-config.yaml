apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devmeet
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/alerts.yml"

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - devmeet
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

  alerts.yml: |
    groups:
      - name: DevMeetSLOAlerts
        rules:
          # SLO 1: Groq AI Interviewer Latency > 2s
          - alert: GroqLatencyHigh
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="ai-interviewer-service"}[5m])) by (le)) > 2
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High Groq AI Interviewer Latency"
              description: "95th percentile of Groq AI request latency is {{ $value }}s, exceeding the SLO threshold of 2s."

          # SLO 2: Code Execution Service Error Rate > 5%
          - alert: CodeExecutionErrorRateHigh
            expr: (sum(rate(http_requests_total{job="code-execution-service", status=~"5.."}[5m])) / sum(rate(http_requests_total{job="code-execution-service"}[5m]))) * 100 > 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High Code Execution Error Rate"
              description: "Error rate for Code Execution Service is {{ $value }}%, exceeding the SLO threshold of 5%."

          # SLO 3: Auth Service MFA Failures High
          - alert: AuthServiceMFAFailuresSpike
            expr: sum(rate(auth_mfa_failures_total[5m])) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Spike in MFA Verification Failures"
              description: "Auth service is experiencing an elevated rate of MFA failures: {{ $value }} per second."

          # SLO 4: Dependency Unavailable (Postgres / Redis Down)
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service instance is down"
              description: "Instance {{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."
