  # ── JWT ───────────────────────────────────────────────────────────────────
  JWT_SECRET_KEY: "REDACTED_JWT_SECRET_KEY"
  JWT_ALGORITHM: "HS256"

  # ── AI (Groq) ─────────────────────────────────────────────────────────────
  GROQ_API_KEY: "REDACTED_GROQ_API_KEY"

  # ── AWS ───────────────────────────────────────────────────────────────────
  AWS_ACCESS_KEY_ID: "REDACTED_AWS_ACCESS_KEY_ID"
