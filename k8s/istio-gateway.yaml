---
# Istio Gateway for external traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: devmeet-gateway
  namespace: devmeet
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: devmeet-tls-cert
    hosts:
    - "*.devmeet.com"
    - "devmeet.com"
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*.devmeet.com"
    - "devmeet.com"
    # HTTP to HTTPS redirect
    tls:
      httpsRedirect: true

---
# Virtual Service for routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devmeet-routes
  namespace: devmeet
spec:
  hosts:
  - "api.devmeet.com"
  gateways:
  - devmeet-gateway
  http:
  # Auth routes
  - match:
    - uri:
        prefix: /api/v1/auth
    route:
    - destination:
        host: auth-service
        port:
          number: 8001
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream

  # User routes
  - match:
    - uri:
        prefix: /api/v1/users
    route:
    - destination:
        host: user-service
        port:
          number: 8002
    timeout: 30s

  # Orchestrator routes
  - match:
    - uri:
        prefix: /api/v1/sessions
    route:
    - destination:
        host: orchestrator-service
        port:
          number: 8003
    timeout: 60s

  # AI Interviewer routes
  - match:
    - uri:
        prefix: /api/v1/interview
    route:
    - destination:
        host: ai-interviewer-service
        port:
          number: 8004
    timeout: 120s

  # Code Execution routes
  - match:
    - uri:
        prefix: /api/v1/code
    route:
    - destination:
        host: code-execution-service
        port:
          number: 8005
    timeout: 15s

  # Video routes
  - match:
    - uri:
        prefix: /api/v1/video
    route:
    - destination:
        host: video-service
        port:
          number: 8006
    timeout: 30s

  # Feedback routes
  - match:
    - uri:
        prefix: /api/v1/feedback
    route:
    - destination:
        host: feedback-service
        port:
          number: 8007
    timeout: 120s

  # Notification routes
  - match:
    - uri:
        prefix: /api/v1/notifications
    route:
    - destination:
        host: notification-service
        port:
          number: 8008
    timeout: 30s

  # Analytics routes
  - match:
    - uri:
        prefix: /api/v1/analytics
    route:
    - destination:
        host: analytics-service
        port:
          number: 8009
    timeout: 30s

  # Admin routes
  - match:
    - uri:
        prefix: /api/v1/admin
    route:
    - destination:
        host: admin-service
        port:
          number: 8010
    timeout: 30s

  # File routes
  - match:
    - uri:
        prefix: /api/v1/files
    route:
    - destination:
        host: file-service
        port:
          number: 8011
    timeout: 60s

  # Payment routes
  - match:
    - uri:
        prefix: /api/v1/payments
    route:
    - destination:
        host: payment-service
        port:
          number: 8012
    timeout: 30s

  # Search routes
  - match:
    - uri:
        prefix: /api/v1/search
    route:
    - destination:
        host: search-service
        port:
          number: 8013
    timeout: 30s

---
# Strict mTLS for all services in namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: devmeet
spec:
  mtls:
    mode: STRICT

---
# Authorization Policy - require JWT for most endpoints
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: require-jwt
  namespace: devmeet
spec:
  selector:
    matchLabels:
      require-auth: "true"
  action: ALLOW
  rules:
  - when:
    - key: request.auth.claims[iss]
      values: ["https://devmeet.com"]
    - key: request.auth.claims[exp]
      notValues: ["0"]

---
# Public endpoints - no auth required
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: public-endpoints
  namespace: devmeet
spec:
  action: ALLOW
  rules:
  - to:
    - operation:
        paths:
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/auth/oauth/*
        - /api/v1/auth/forgot-password
        - /api/v1/auth/reset-password
        - /health
        - /metrics

---
# Destination Rules for mTLS
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: devmeet-services-mtls
  namespace: devmeet
spec:
  host: "*.devmeet.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
