# Runs Nginx worker processes as this operating-system user.
user  nginx;
# Chooses how many Nginx worker processes to run.
worker_processes  auto;

# Sets where Nginx writes operational and error messages.
error_log  /var/log/nginx/error.log notice;
# Sets the file where Nginx records its process ID.
pid        /var/run/nginx.pid;

# Starts settings for how Nginx handles network connections.
events {
    # Sets the maximum open connections per worker, subject to OS limits.
    worker_connections  1024;
# Ends the current Nginx settings block.
}

# Starts settings shared by HTTP servers and routes.
http {
    # Loads standard MIME type mappings from this file.
    include       /etc/nginx/mime.types;
    # Uses this content type when no specific type is known.
    default_type  application/octet-stream;

    # Defines which request details are written to the access log; the following quoted lines continue this format.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Writes requests to the access log using the named format.
    access_log  /var/log/nginx/access.log  main;

    # Enables efficient operating-system file transfers.
    sendfile        on;
    # Keeps an idle client connection reusable for this many seconds.
    keepalive_timeout  65;

    # Rate limiting zones (configured for high-throughput local development and automated testing)
    # Defines shared per-client request counters for api_general, with a rate of 60 requests per second.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
    # Defines shared per-client request counters for auth_login, with a rate of 60 requests per second.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=60r/s;
    # Defines shared per-client request counters for code_exec, with a rate of 30 requests per second.
    limit_req_zone $binary_remote_addr zone=code_exec:10m rate=30r/s;
    # Defines shared per-client request counters for ai_interview, with a rate of 30 requests per second.
    limit_req_zone $binary_remote_addr zone=ai_interview:10m rate=30r/s;

    # Limits the size of an incoming request body in this context.
    client_max_body_size 10m;

    # Limits how long Nginx waits to connect to a backend service.
    proxy_connect_timeout 10s;
    # Limits the idle wait between reading data from the backend.
    proxy_read_timeout 60s;
    # Limits the idle wait while sending request data to the backend.
    proxy_send_timeout 30s;

    # Sets the DNS server Nginx uses to find Docker service addresses and how long to cache answers.
    resolver 127.0.0.11 valid=30s;

    # ── Dynamic CORS origin: mirrors localhost, local IP, or Cloudflare tunnel origins ──
    # Creates a variable by matching the incoming browser Origin against the rules below.
    map $http_origin $cors_origin {
        # Uses this value when none of the mapping rules match.
        default                                          "";
        # Allows this matching local or tunnel origin and returns its Origin value for CORS.
        "~^https?://localhost(:[0-9]+)?$"                $http_origin;
        # Allows this matching local or tunnel origin and returns its Origin value for CORS.
        "~^https?://127\.0\.0\.1(:[0-9]+)?$"            $http_origin;
        # Allows this matching local or tunnel origin and returns its Origin value for CORS.
        "~^https?://16\.192\.160\.85(:[0-9]+)?$"        $http_origin;
        # Allows this matching local or tunnel origin and returns its Origin value for CORS.
        "~^https?://.*\.trycloudflare\.com(:[0-9]+)?$"   $http_origin;
    # Ends the current Nginx settings block.
    }

    # Starts the virtual server that receives gateway requests.
    server {
        # Makes this virtual server listen on the specified port.
        listen 8000;
        # Names the host this virtual server is configured to serve.
        server_name localhost;

        # Security headers
        # Tells browsers not to guess a different content type. The always option also adds it to error responses.
        add_header X-Content-Type-Options "nosniff" always;
        # Prevents this page from being embedded in a frame. The always option also adds it to error responses.
        add_header X-Frame-Options "DENY" always;
        # Enables the legacy browser cross-site-scripting filter. The always option also adds it to error responses.
        add_header X-XSS-Protection "1; mode=block" always;
        # Limits referrer details sent to other websites. The always option also adds it to error responses.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gateway health check
        # Selects which URL path this block will handle.
        location = /health {
            # Turns off access logging for this location.
            access_log off;
            # Sends this response immediately instead of forwarding the request.
            return 200 '{"status":"ok","service":"api-gateway"}';
            # Labels the response as this content type.
            add_header Content-Type application/json;
        # Ends the current Nginx settings block.
        }

        # Internal auth verification for RBAC (admin routes)
        # Selects which URL path this block will handle.
        location = /auth/verify-admin {
            # Allows this URL to be used internally by Nginx, not called directly by clients.
            internal;
            # Stores the internal backend service address in a variable for proxy_pass.
            set $upstream_verify http://auth-service:8001/api/v1/auth/verify-admin;
            # Forwards this request to the selected internal backend service.
            proxy_pass $upstream_verify;
            # Controls whether the original request body is sent to the backend.
            proxy_pass_request_body off;
            # Clears the body-length header because the auth subrequest has no body.
            proxy_set_header Content-Length "";
            # Tells the auth service the original requested URL.
            proxy_set_header X-Original-URI $request_uri;
            # Tells the auth service the original HTTP method.
            proxy_set_header X-Original-Method $request_method;
            # Passes the caller login credential to the auth service.
            proxy_set_header Authorization $http_authorization;
        # Ends the current Nginx settings block.
        }

        # ── Shared CORS + proxy macro ─────────────────────────────────────────
        # These are set by the include pattern below using a common snippet.
        # Each location block adds CORS headers and handles OPTIONS inline.

        # 1. Auth Service (8001)
        # Selects which URL path this block will handle.
        location /api/v1/auth {
            # Checks whether this is a browser CORS preflight OPTIONS request.
            if ($request_method = 'OPTIONS') {
                # Tells the browser which origin may read this response. The always option also adds it to error responses.
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                # Allows browser requests to include credentials. The always option also adds it to error responses.
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                # Lists HTTP methods allowed for cross-origin requests. The always option also adds it to error responses.
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                # Lists request headers allowed by the browser. The always option also adds it to error responses.
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-ID' always;
                # Tells the browser how long to cache this preflight permission. The always option also adds it to error responses.
                add_header 'Access-Control-Max-Age'           1728000 always;
                # Labels the response as this content type. The always option also adds it to error responses.
                add_header 'Content-Type'                     'text/plain; charset=utf-8' always;
                # Sets the response body length. The always option also adds it to error responses.
                add_header 'Content-Length'                   0 always;
                # Sends this response immediately instead of forwarding the request.
                return 204;
            # Ends the current Nginx settings block.
            }
            # Tells the browser which origin may read this response. The always option also adds it to error responses.
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            # Allows browser requests to include credentials. The always option also adds it to error responses.
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            # Lists HTTP methods allowed for cross-origin requests. The always option also adds it to error responses.
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            # Lists request headers allowed by the browser. The always option also adds it to error responses.
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-ID' always;
            # Applies the selected request-rate rule; burst allows a short excess and nodelay does not queue it.
            limit_req zone=auth_login burst=50 nodelay;
            # Hides this backend response header so the gateway can apply its own CORS policy.
            proxy_hide_header 'Access-Control-Allow-Origin';
            # Hides this backend response header so the gateway can apply its own CORS policy.
            proxy_hide_header 'Access-Control-Allow-Credentials';
            # Hides this backend response header so the gateway can apply its own CORS policy.
            proxy_hide_header 'Access-Control-Allow-Methods';
            # Hides this backend response header so the gateway can apply its own CORS policy.
            proxy_hide_header 'Access-Control-Allow-Headers';
            # Stores the internal backend service address in a variable for proxy_pass.
            set $upstream_auth http://auth-service:8001;
            # Forwards this request to the selected internal backend service.
            proxy_pass $upstream_auth;
            # Passes the original requested host name.
            proxy_set_header Host $host;
            # Passes the client address Nginx sees.
            proxy_set_header X-Real-IP $remote_addr;
            # Adds the client address to the forwarded address chain.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Tells the backend whether the incoming request used HTTP or HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;
        # Ends the current Nginx settings block.
        }

